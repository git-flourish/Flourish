name: Deploy to Firebase Hosting

on:
  push:
    branches: [main, feat/flourish-rebuild, firebase-hosting-migration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify build secrets are set
        run: |
          test -n "$VITE_WEB3FORMS_ACCESS_KEY" || (echo "Missing VITE_WEB3FORMS_ACCESS_KEY" && exit 1)
          test -n "$VITE_EMAILJS_PUBLIC_KEY" || (echo "Missing VITE_EMAILJS_PUBLIC_KEY" && exit 1)
          test -n "$VITE_EMAILJS_SERVICE_ID" || (echo "Missing VITE_EMAILJS_SERVICE_ID" && exit 1)
          test -n "$VITE_EMAILJS_WELCOME_TEMPLATE_ID" || (echo "Missing VITE_EMAILJS_WELCOME_TEMPLATE_ID" && exit 1)
        env:
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_WELCOME_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_WELCOME_TEMPLATE_ID }}
      - run: npm run build
        env:
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_WELCOME_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_WELCOME_TEMPLATE_ID }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
